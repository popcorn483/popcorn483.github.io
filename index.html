<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr Butler | Popcorn</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      background: radial-gradient(circle at center, #0f0f0f, #000);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    .nav {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 3;
    }
    .nav a {
      text-decoration: none;
      color: #fff;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 187, 0, 0.2);
      border: 2px solid #ffbb00;
      border-radius: 30px;
      transition: background 0.3s, transform 0.2s;
    }
    .nav a:hover {
      background: #ffbb00;
      color: #000;
      transform: scale(1.05);
    }
    .container {
      position: relative;
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2;
      text-align: center;
    }
    h1 {
      font-size: 4rem;
      background: linear-gradient(45deg, #facc15, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    h2 {
      font-size: 1.5rem;
      color: #aaa;
    }
    .popcorn {
      position: absolute;
      width: 30px;
      height: 30px;
      background-image: url('https://png.pngitem.com/pimgs/s/187-1876163_popcorn-no-background-piece-of-popcorn-transparent-hd.png');
      background-size: contain;
      background-repeat: no-repeat;
      opacity: 1;
      filter: drop-shadow(0 0 4px #fff);
    }
    @keyframes float-clockwise {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      20% { opacity: 1; }
      60% { opacity: 1; }
      100% {
        transform: translateY(-30vh) rotate(360deg);
        opacity: 0;
      }
    }
    @keyframes float-counter {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      20% { opacity: 1; }
      100% {
        transform: translateY(-20vh) rotate(-360deg);
        opacity: 0;
      }
    }
    .screen-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 10px solid #ffbb00;
      box-shadow: 0 0 40px #ffbb00 inset;
      pointer-events: none;
    }
    .glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255,255,255,0.05), transparent);
      pointer-events: none;
    }
    /* Link tree */
    .links {
      width: 100%;
      max-width: 560px;
      margin-top: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }
    .group {
      color: #ffbb00;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 14px 0 0 6px;
    }
    .group:first-child { margin-top: 0; }
    .link {
      display: block;
      text-decoration: none;
      color: #fff;
      padding: 14px 20px;
      background: rgba(18, 14, 4, 0.88);
      border: 2px solid #ffbb00;
      border-radius: 18px;
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }
    .link strong { display: block; font-size: 1.1rem; }
    .link span { display: block; color: #bbb; font-size: 0.92rem; margin-top: 2px; }
    .link:hover, .link:focus-visible {
      background: #ffbb00;
      color: #000;
      transform: translateY(-2px);
      outline: none;
    }
    .link:hover span, .link:focus-visible span { color: #2a2000; }
    /* Password gate */
    .gate {
      width: 100%;
      max-width: 420px;
      margin-top: 2.5rem;
      padding: 22px 24px;
      background: rgba(18, 14, 4, 0.88);
      border: 2px solid #ffbb00;
      border-radius: 18px;
      text-align: left;
    }
    .gate > label { display: block; font-weight: bold; margin-bottom: 10px; }
    .gate-row { display: flex; gap: 10px; }
    .gate input[type="password"] {
      flex: 1;
      min-width: 0;
      padding: 10px 14px;
      border-radius: 30px;
      border: 2px solid #665000;
      background: #000;
      color: #fff;
      font: inherit;
    }
    .gate input[type="password"]:focus { outline: none; border-color: #ffbb00; }
    .gate button, .lock {
      padding: 10px 20px;
      border-radius: 30px;
      border: 2px solid #ffbb00;
      background: #ffbb00;
      color: #000;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }
    .gate button:disabled { opacity: 0.6; cursor: wait; }
    .remember { display: flex; gap: 8px; align-items: center; margin-top: 12px; color: #bbb; font-size: 0.92rem; }
    .remember input { accent-color: #ffbb00; }
    .gate-msg { margin-top: 10px; min-height: 1.2em; color: #ff9a6b; font-size: 0.92rem; }
    .lock { margin-top: 18px; background: transparent; color: #ffbb00; padding: 6px 16px; font-size: 0.9rem; }
    .lock:hover { background: #ffbb00; color: #000; }
    #vault { width: 100%; display: flex; justify-content: center; }
    /* The page itself never scrolls (that keeps the kernels as they were), so the list scrolls inside its own area */
    .links {
      max-height: calc(100vh - 300px);
      overflow-y: auto;
      padding: 4px 8px 4px 4px;
      scrollbar-color: #ffbb00 transparent;
    }
    @media (max-width: 600px) {
      h1 { font-size: 3rem; }
      .nav { gap: 8px; }
      .links { max-height: calc(100vh - 260px); }
      .nav a { padding: 8px 12px; font-size: 0.9rem; white-space: nowrap; }
    }
    @media (prefers-reduced-motion: reduce) {
      .popcorn { display: none; }
      .link { transition: none; }
    }
  </style>
</head>
<body>
  <div class="screen-frame"></div>
  <div class="glow"></div>
  
  
  <div class="container">
    <h1>Mr Butler</h1>
    <h2>Popcorn | Gamer & Movie Buff</h2>

    <form class="gate" id="gate" autocomplete="off">
      <label for="pw">Enter the password to see my sites</label>
      <div class="gate-row">
        <input id="pw" type="password" autocomplete="current-password" required>
        <button type="submit" id="unlock">Unlock</button>
      </div>
      <label class="remember"><input type="checkbox" id="remember"> Remember me on this device</label>
      <p class="gate-msg" id="msg" role="status" aria-live="polite"></p>
    </form>
    <div id="vault" hidden></div>
    <button type="button" class="lock" id="lock" hidden>Lock</button>
  </div>

  <!-- Popcorn Kernel Elements -->
  <script>
    const kernelCount = 80;
    for (let i = 0; i < kernelCount; i++) {
      const kernel = document.createElement('div');
      kernel.className = 'popcorn';
      kernel.style.left = Math.random() * 100 + 'vw';
      kernel.style.animationDuration = (5 + Math.random() * 10) + 's';
      kernel.style.animationDelay = (Math.random() * 5) + 's';
      kernel.style.transform = `scale(${0.8 + Math.random() * 0.8})`;
      kernel.style.animationName = Math.random() > 0.5 ? 'float-clockwise' : 'float-counter';
      kernel.style.animationTimingFunction = 'ease-in-out';
      kernel.style.animationIterationCount = 'infinite';
      document.body.appendChild(kernel);
    }
  </script>
  <!-- Password lock: the site list is encrypted (AES-256-GCM, key from PBKDF2-SHA-256, 600,000 rounds).
       The password is not stored here. To change it, re-encrypt the list with a new password. -->
  <script>
    (function () {
      const VAULT = {"salt": "aceoa5Ve6vXTLB80YaJNEQ==", "iv": "b5zOnaKWg9YbtFvX", "ct": "RgrlXYZllU8ZfmKYuXLb7ZbCgo3NuEqpqigzuhiorT89CBYafENLpkcomZz+0uGOG4ehBncWt+s3qefSTNxc56YXWjDLSB/pL4mY4C8TfnGs4ZiObs6lOMpL1u7nLnQDtxSPP9fu6TcW3LHqf/glYnSXC+1EyP+i5MATLTLeT+7atTXlsZ/Axs/6s98O8MnXkCAxjg/09nGa6w1BhBm7sfvf2YeLrXpNeJ7+P6yL4i2gGGS8Bd8/my+rTLlF5IYSC+O/l/+duHhFmk5ynb8voSQkvo3ldyScqwoessG0gYv/xFufhXZDk9zDp9HJpFZPsDECJQeW4ej2hI8O3TxulWV8Mne9RX2oRwjG93sOPfCfuECAyTcyh/o6mI7gPibUK4M9l+5WhMMIKwvXdmQhtSHP8JVEPpUQgBvE/zCvXAFsBerdjI0EiI5XrYsxSB/+u7oI5qWqbDwameJXQ6iA+ijqIGtM0EY1i7+/ivIPRmaL+iucALbvJZucqaiWlDOcJ/TZhf6oMPerBJHMNd6Pz5xErWbz5AUvEZk1ITPcFlIig77oCQjK5qd78igN1xfzLL4fzFH8VJ6w6PTgxrzndpKu3T0G2wrDJKuOPy9L5FvGVmJsm+WwEn7KmXZMl4DM/6zarrHqEo5fLM01PYNz8fdjLeVJGTddNtGSwuiImDj46Ja642GTe6XZ+6c2gnTtCdZGMdJzD+zIBDaNB/ZOlRok6RA33fKoj+TxL8De1gznCq7AJ8w5U6sQ+7DPgQKYWXKS0C4R1tDMgi8U6yBqwW4nzH+VoeiaYq302n89cgkGT8pcNN+rBKUhryUKy41NJQXKsselJf8RS3Yq/2CBxKAMxLRJW1ndINFe93ocTYIo/bq1Et8oS7zGMFSA3YihyYJ3b+UDE28xYHWZiu15GhHzW/BA8mYS5lBUeUQsdVe8wmaC/pPiA6vGrGmFMEVzOehUfSLGwrRhYW4eheb+2uqcQ6rorMtyd6eM1VFPv2mPKNNJp6R3B9fVkdUkxLIcakXKSZR1GASunie2LlLS57VNwIG4Z2km4vmKFgk0sklVshBgcZ7MQsVP5OS1dKWw8nYi7ZoJPEvS492wat1CT45YauOud8KtHdvsq7lVJQ5Si5GEU3asBQHu/HlHa9NqGCKqR5Okv1o/POwLMV0mzHtgQLGIvvuZB9df7vy8+wYZPLRpvDBoxwZVEh888BkSzksTDoRiOvJI/BGPr7BHtoNZ98G8PtzLqcoLGElJHb0njgvwGKHUs2jn1DcFGulPEqSz9XG2djH6tTp+JI/UcLx80d77JTYgntVFAGbiueD9mxnFLDX9HK36S8MGMavJvweMv0v9HsFJTIM4hciAQV7viXfMN01j6pXYNJKIOz6Yk/f+CMO3IvD4mlF2A2nx2CPO9R78UkJd7KN2F/8Ss2MXJ8wwt+ldptF6rWJqbAia76FIL7ZPlNdgEyxgO9j07pQQ6b8SHrPgaBpU/pe5VH1UD01XwV2cB66JX+oVCTazlG4OVvzRf+njjet4P2/ztjIh0eBKjv8e/7AImVOCw2vHazxG7LdYsOuDjm66A+VQ6gXxsAztT8BEIBqnUjtT2223jLfBK8r6NPMVE0wQZ3YHnF3Y33ggbtSVaLUijoP3ullfCYgL6Z6jdemqBSgmWH894ARfq+yPgtZENqL3fcmET1S9F00NIPUsQdk+nF5usVz4zZG9lwByyLVJyKwFduSBszY0M1/tiOLfuSSivR+X7NRtbbXDNkI7/cSGhrpYFVyB0edSfN591qIExjilPHp6X16mi96nd97HfKUYnM43TgJsIQM/LrrXdc8rRh9wz0ozOnUvAjZE0ldGQUbvLzAIWMycoFOQY1jeiRC7+PCqBMsAybtiXOMJiwdN3UfS+iabViUqE+ETNdUnwLldD3GFyEQ1t+XPTCHaEYcDcpxqVwBmDTPx6Cxc0Q/MYGLFEqOwzkOoge36ErQ="};
      const KEY_STORE = "mrbutler.home.key";
      const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
      const $ = (id) => document.getElementById(id);

      async function keyFromPassword(pw) {
        const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
        return crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(VAULT.salt), iterations: 600000, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      }
      async function open(key) {
        const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(VAULT.iv) }, key, bytes(VAULT.ct));
        $("vault").innerHTML = new TextDecoder().decode(plain);
        $("vault").hidden = false;
        $("gate").hidden = true;
        $("lock").hidden = false;
      }
      function forget() { try { localStorage.removeItem(KEY_STORE); } catch (e) {} }

      $("gate").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = $("unlock");
        btn.disabled = true;
        $("msg").textContent = "Unlocking…";
        try {
          const key = await keyFromPassword($("pw").value);
          await open(key);
          $("msg").textContent = "";
          if ($("remember").checked) {
            const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
            try { localStorage.setItem(KEY_STORE, btoa(String.fromCharCode(...raw))); } catch (e) {}
          }
        } catch (err) {
          $("msg").textContent = "That password isn't right. Check it and try again.";
          $("pw").select();
        } finally {
          btn.disabled = false;
        }
      });

      $("lock").addEventListener("click", () => {
        forget();
        $("vault").innerHTML = "";
        $("vault").hidden = true;
        $("lock").hidden = true;
        $("gate").hidden = false;
        $("pw").value = "";
        $("pw").focus();
      });

      // Reopen straight away on a device that chose "Remember me".
      (async () => {
        let saved = null;
        try { saved = localStorage.getItem(KEY_STORE); } catch (e) {}
        if (!saved) return;
        try {
          const key = await crypto.subtle.importKey("raw", bytes(saved), "AES-GCM", false, ["decrypt"]);
          await open(key);
        } catch (e) { forget(); }
      })();
    })();
  </script>

</body>
</html>
